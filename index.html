    }

    if(["0〜19歳","20代","30代","40代","50代"].includes(state.user.age)){

      return ["国民健康保険","協会けんぽ","共済・組合等","生活保護","わからない"];

  },

  burdenRateButtons(){

    if(state.user.insurance === "生活保護"){
      return [];
    }

    if(
      state.user.age === "75歳以上"
      &&
      state.user.insurance === "後期高齢者"
    ){

      return ["不明","1割","2割","3割"];

    }

    if(
      ["20代","30代","40代","50代","60代"].includes(state.user.age)
    ){

      return ["3割"];

    }

    if(state.user.age === "70歳〜74歳"){

      return ["不明","2割","3割"];

    }

    return ["不明","1割","2割","3割"];

  },

  skipBurdenRate(){

    return (
      state.user.insurance === "生活保護"
      ||
      state.user.insurance === "わからない"
    );

  },

  isOver70(){

    return (

},

  age:{
    reducer:(text)=>{
      state.user.age = text;
    },
    next:()=>{
      return "insurance";
    }
  },

  insurance:{

    reducer:(text)=>{

      state.user.insurance = text;

      if(text === "生活保護"){

        state.user.burdenRate = "なし";
        state.user.limit = "対象外";

      }

      if(text === "わからない"){

        state.user.burdenRate = "不明";
        state.user.limit = "不明";

      }

    },

    next:()=>{

      if(validators.skipBurdenRate()){
        return getAfterLimitScreen();
      }

      const eligibleInsurance = ["協会けんぽ","共済・組合等"];

      if(eligibleInsurance.includes(state.user.insurance)){
        return "insuranceHolderCheck";
      }

      return "burdenRate";

    }

  },

  insuranceHolderCheck:{

    reducer:(text)=>{
      state.user.insuranceHolderType = text;
    },

    next:()=>{
      return "burdenRate";
    }

  },

  burdenRate:{
  reducer:(text)=>{

    state.user.burdenRate = text;

    if(text === "不明"){
      state.user.limit = "不明";
      return;
    }

    if(
      state.user.insurance === "後期高齢者" &&
      text === "2割"
    ){
      state.user.limit = "一般";
    }

  },

  next:()=>{

  if(state.user.burdenRate === "不明"){
    return getAfterLimitScreen();
  }

  if(
    state.user.insurance === "後期高齢者" &&
    state.user.burdenRate === "2割"
  ){
    return getAfterLimitScreen();
  }

  return "limit";

}
},

  limit:{
    reducer:(text)=>{
      state.user.limit = text;
    },
    next:()=>{
      return getAfterLimitScreen();
    }
  },

  careLevel:{

    reducer:(text)=>{

      state.user.careLevel = text;

      if(text === "なし"){
        state.user.mealStage = "なし";
      }

      if(text === "わからない"){

        addBotMessage(`要介護度がわからない場合は、

「介護保険被保険者証」に記載されています。

お手元にない場合は、
担当のケアマネジャーや
お住まいの市区町村へ
ご確認ください。`);

      }

    },

    next:()=>{

      if(state.user.careLevel === "なし"){
        state.user.supportSystems = [];
        return "supportSystems";
      }

      const MEAL_STAGE_ELIGIBLE_LIMITS = ["オ","低Ⅱ","低Ⅰ"];

      const isLikelyIneligible =
        state.user.limit
        &&
        state.user.limit !== "不明"
        &&
        state.user.limit !== "対象外"
        &&
        !MEAL_STAGE_ELIGIBLE_LIMITS.includes(state.user.limit);

      if(isLikelyIneligible){
        state.user.mealStage = "対象外";
        state.user.supportSystems = [];
        return "supportSystems";
      }

      return "mealStage";

    }

  },

  mealStage:{

    reducer:(text)=>{

      state.user.mealStage = text;

      if(text === "わからない"){

        addBotMessage(`食事・居住費の負担段階がわからない場合は、

「負担限度額認定証」に記載されています。

認定証をお持ちでない場合は、
段階の適用がない（通常の負担額の）
可能性があります。

くわしくは、施設や
お住まいの市区町村へ
ご確認ください。`);

      }

    },

    next:()=>{
      state.user.supportSystems = [];
      return "supportSystems";
    }

  },

  supportSystems:{

    reducer:(text)=>{

      if(text === "なし"){

        state.user.supportSystems = [];

        releaseInfoBox();

        if(!state.profileCollected){
          addBotMessage("ありがとうございます。\nここまで整理できました。");
        }

        return;

      }

      if(text === "決定"){

        releaseInfoBox();

        if(!state.profileCollected){
          addBotMessage("ありがとうございます。\nここまで整理できました。");
        }

        return;

      }

      if(
        !state.user.supportSystems
          .includes(text)
      ){

        state.user.supportSystems
          .push(text);

      }

    },

    next:(selected)=>{

      if(
        selected === "決定"
        ||
        selected === "なし"
      ){

        state.profileCollected = true;

        if(hasUnclearProfileItems()){
          return "profileUnclearCheck";
        }

        return resolveAfterProfileComplete();

      }

      return "supportSystems";

    }

  },

  profileSummary:{

    reducer:(text)=>{

      if(text==="プロフィールをリセット"){
        resetProfileOnly();
      }

    },

    next:(text)=>{

      if(text==="プロフィールを編集する"){
        return "age";
      }

      return "purpose";

    }

  },

  profileUnclearCheck:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text==="する"){
        return "profileUnclearGuideMenu";
      }

      return resolveAfterProfileComplete();

    }

  },

  profileUnclearGuideMenu:{

    reducer:(text)=>{

      const target =
        PROFILE_UNCLEAR_BUTTONS.find(b => b.label === text);

      if(target){
        addBotMessage(PROFILE_UNCLEAR_INFO[target.key]);
      }

    },

    next:(text)=>{

      if(text==="相談に進む"){
        return resolveAfterProfileComplete();
      }

      if(text==="プロフィールを編集する"){
        return "age";
      }

      return "profileUnclearGuideMenu";

    }

  },

  employmentStatus:{

    reducer:(text)=>{
      state.user.employment = text;
    },

    next:(text)=>{

      if(text==="はい"){
        return "workOnLeave";
      }

      return "familyStructure";

    }

  },

  workOnLeave:{

    reducer:(text)=>{
      state.user.workOnLeave = text;
    },

    next:(text)=>{

      if(text==="はい"){
        return "leaveType";
      }

      return "familyStructure";

    }

  },

  leaveType:{

    reducer:(text)=>{
      state.user.leaveType = text;
    },

    next:(text)=>{

      const eligibleInsurance = ["協会けんぽ","共済・組合等"];

      if(
        text==="欠勤"
        &&
        eligibleInsurance.includes(state.user.insurance)
        &&
        state.user.insuranceHolderType !== "家族の扶養"
      ){
        return "sickLeaveAllowanceCheck";
      }

      return "familyStructure";

    }

  },

  sickLeaveAllowanceCheck:{

    reducer:(text)=>{
      state.user.sickLeaveAllowanceApplied = text;
    },

    next:()=>{
      return "familyStructure";
    }

  },

  familyStructure:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text!=="決定"){
        return "familyStructure";
      }

      if(state.user.familyMembers.length === 0){
        state.user.livingWithFamily = [];
        state.user.workingFamilyMembers = [];
        return "purpose";
      }

      const CHILD_LABELS = ["長男","長女","次男","次女","三男","三女"];

      const hasChild =
        state.user.familyMembers.some(
          m=>CHILD_LABELS.includes(m)
        );

      if(hasChild){
        return "childSpouseCheck";
      }

      return "deceasedFamilyCheck";

    }

  },

  childSpouseCheck:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text!=="決定"){
        return "childSpouseCheck";
      }

      return "deceasedFamilyCheck";

    }

  },

  deceasedFamilyCheck:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text!=="決定"){
        return "deceasedFamilyCheck";
      }

      const survivors =
        state.user.familyMembers.filter(
          m=>!state.user.deceasedFamilyMembers.includes(m)
        );

      if(survivors.length === 0){
        state.user.livingWithFamily = [];
        state.user.workingFamilyMembers = [];
        return "purpose";
      }

      return "livingWithFamily";

    }

  },

  livingWithFamily:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text!=="決定"){
        return "livingWithFamily";
      }

      if(state.user.livingWithFamily.length === 0){
        state.user.workingFamilyMembers = [];
        return "purpose";
      }

      return "workingFamilyMembers";

    }

  },

  workingFamilyMembers:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text!=="決定"){
        return "workingFamilyMembers";
      }

      return "aloneDuringDayCheck";

    }

  },

  aloneDuringDayCheck:{

    reducer:(text)=>{
      state.user.aloneDuringDay = text;
    },

    next:()=>{

      const survivors =
        state.user.familyMembers.filter(
          m=>!state.user.deceasedFamilyMembers.includes(m)
        );

      const hasLivingWithFamily =
        state.user.livingWithFamily
        &&
        state.user.livingWithFamily.length > 0;

      if(survivors.length === 0 || !hasLivingWithFamily){
        return "purpose";
      }

      return "potentialCaregiverCheck";

    }

  },

  potentialCaregiverCheck:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text!=="決定"){
        return "potentialCaregiverCheck";
      }

      if(state.user.potentialCaregivers.includes("配偶者")){
        return "spouseCareCheck";
      }

      return routeAfterCaregiverAssessment();

    }

  },

  spouseCareCheck:{

    reducer:(text)=>{
      state.user.spouseCareLevel = text;
    },

    next:()=>{
      return "spouseDementiaCheck";
    }

  },

  spouseDementiaCheck:{

    reducer:(text)=>{
      state.user.spouseDementia = text;
    },

    next:()=>{
      return routeAfterCaregiverAssessment();
    }

  },

  childConditionCheck:{

    reducer:(text)=>{

      if(text!=="決定"){
        return;
      }

      state.user.childConditions[
        state.user.currentChildBeingAsked
      ] = state.user.currentChildConditionsTemp;

    },

    next:(text)=>{

      if(text!=="決定"){
        return "childConditionCheck";
      }

      return routeAfterCaregiverAssessment();

    }

  },

  paymentAssessmentEmployment:{

    reducer:(text)=>{},

    next:(text)=>{

      if(text==="はい"){
        return "paymentAssessmentLeaveType";
      }

      return "paymentAssessmentPensionCheck";

    }

  },

  paymentAssessmentPensionCheck:{

    reducer:(text)=>{
      state.user.pensionIncome = text;
    },

    next:(text)=>{

      if(text==="いいえ"){
        return "paymentAssessmentFamilyLivelihoodCheck";
      }

      return "paymentAssessmentLivingCost";

    }

  },

  paymentAssessmentFamilyLivelihoodCheck:{

    reducer:(text)=>{
      state.user.familyLivelihoodNoWorry = text;
    },

    next:()=>{
      return "paymentAssessmentLivingCost";
    }

  },

  paymentAssessmentLeaveType:{

    reducer:(text)=>{

      if(text==="有給休暇"){

        // 質問は次の画面（足りるかどうか）で行うため、
        // ここでは何もしない

      }else if(text==="欠勤"){

        const u = state.user;

// 複数選択トグル画面を共通で描画する
// （supportSystemsと同じ考え方。同じ画面のまま
// 　トグルし、間に発言が挟まっても正しく置き換える）
function renderToggleMultiSelect(options, arrayField, extraButtons){

  const area = document.getElementById("choiceButtons");

  area.style.display = "none";

  const chatEl = document.getElementById("chat");

  if(
    currentInlineButtonsInfo.screen === state.currentScreen
    &&
    currentInlineButtonsInfo.element
    &&
    currentInlineButtonsInfo.element.parentNode === chatEl
  ){
    chatEl.removeChild(currentInlineButtonsInfo.element);
  }

  const wrapper = document.createElement("div");

  wrapper.className = "inline-buttons";

  options.forEach(text=>{

    const btn = document.createElement("button");

    const isActive = state.user[arrayField].includes(text);

    btn.className = "inline-button" + (isActive ? " active" : "");

    const labelSpan = document.createElement("span");

    labelSpan.className = "inline-button-label";

    labelSpan.innerText = text;

    btn.appendChild(labelSpan);

    btn.onclick = ()=>{

      const idx = state.user[arrayField].indexOf(text);

      if(idx === -1){
        state.user[arrayField].push(text);
        btn.classList.add("active");
      }else{
        state.user[arrayField].splice(idx,1);
        btn.classList.remove("active");
      }

    };

    wrapper.appendChild(btn);

  });

  extraButtons.forEach(b=>{

    const btn = document.createElement("button");

    btn.className =
      "inline-button" +
      (b.secondary ? " secondary" : "") +
      (b.highlight ? " highlight" : "");

    const labelSpan = document.createElement("span");

    labelSpan.className = "inline-button-label";

    labelSpan.innerText = b.label;

    btn.appendChild(labelSpan);

    btn.onclick = b.onclick;

    wrapper.appendChild(btn);

  });

  chatEl.appendChild(wrapper);

  currentInlineButtonsInfo = {
    screen:state.currentScreen,
    element:wrapper
  };

  ensureScrollRoom();

}

  }

  if(u.adlLevel){

`;
  }

    text += `同居家族: ${val(u.livingWith)}
`;
  }

  if(u.familyMembers && u.familyMembers.length){

    text += `家族構成: ${u.familyMembers.join("、")}
`;

    if(u.deceasedFamilyMembers && u.deceasedFamilyMembers.length){
      text += `（うち他界: ${u.deceasedFamilyMembers.join("、")}）
`;
    }

    text += `同居している家族: ${
      (u.livingWithFamily && u.livingWithFamily.length)
        ? u.livingWithFamily.join("、")
        : "なし"
    }
`;

    text += `同居家族で就労中: ${
      (u.workingFamilyMembers && u.workingFamilyMembers.length)
        ? u.workingFamilyMembers.join("、")
        : "なし"
    }
`;

    if(u.potentialCaregivers && u.potentialCaregivers.length){
      text += `支援が期待できる家族: ${u.potentialCaregivers.join("、")}
`;
    }

  }

  if(u.aloneDuringDay){
    text += `日中独居: ${val(u.aloneDuringDay)}
`;
  }

  if(u.spouseCareLevel){
    text += `配偶者の要介護認定: ${val(u.spouseCareLevel)}
`;
  }

  if(u.spouseDementia){
    text += `配偶者の認知症: ${val(u.spouseDementia)}
`;
  }

  if(u.childConditions && Object.keys(u.childConditions).length){

    Object.keys(u.childConditions).forEach(child=>{

      const conditions = u.childConditions[child];

      text += `${child}の状態: ${
        conditions.length ? conditions.join("、") : "なし"
      }
`;

    });

  }

  text += `該当する制度: ${support}
`;

  text += `
この内容は、このブラウザを閉じるまで
一時的に保存されます。
外部やサーバーには送信・保存されません。

間違いがある場合は、
「プロフィールをリセット」から
やり直せます。`;

  return text;

}

// プロフィールから課税/非課税を判定する共通関数
// （食費区分優先、なければ限度額区分で判定）
function getTaxStatusFromProfile(){

  const u = state.user;

  if(u.insurance === "生活保護"){
    return { status:"生活保護", basisLabel:"" };
  }

  const nonTaxedStages = [
    "第一段階","第二段階","第三段階①","第三段階②"
  ];

  if(u.mealStage === "第四段階（課税）"){
    return { status:"課税", basisLabel:`食費区分：${u.mealStage}` };
  }

  if(nonTaxedStages.includes(u.mealStage)){
    return { status:"非課税", basisLabel:`食費区分：${u.mealStage}` };
  }

  const nonTaxedLimits = ["オ","低Ⅱ","低Ⅰ"];
  const taxedLimits = ["ア","イ","ウ","エ","現役Ⅲ","現役Ⅱ","現役Ⅰ","一般"];

  if(nonTaxedLimits.includes(u.limit)){
    return { status:"非課税", basisLabel:`限度額区分：${u.limit}` };
  }

  if(taxedLimits.includes(u.limit)){
    return { status:"課税", basisLabel:`限度額区分：${u.limit}` };
  }

  return { status:"", basisLabel:"" };

}

/* =========================================
   SCROLL HINT
   （読みきれていない内容がある時だけ
   　「↓ まだ続きがあります」を表示する）
========================================= */

function updateScrollHint(){

  const chat = document.getElementById("chat");

  const hint = document.getElementById("scrollHint");

  if(!chat || !hint){
    return;
  }

  const children = chat.children;

  if(!children || children.length === 0){
    hint.style.display = "none";
    return;
  }

  // 最後の「実際の返信・質問カード」の下端を基準にする
  // （scrollHeightだと、スクロール確保用の
  // 　見えない余白まで「続きがある」と
  // 　誤判定してしまうため）
  const lastContent = children[children.length - 1];

  const contentBottom =
    lastContent.offsetTop
    + lastContent.offsetHeight;

  const visibleBottom =
    chat.scrollTop
    + chat.clientHeight;

  const remaining = contentBottom - visibleBottom;

  if(remaining > 20){

    const choiceButtons = document.getElementById("choiceButtons");

    const controlArea = document.querySelector(".control-area");

    const offset =
      (choiceButtons ? choiceButtons.offsetHeight : 0)
      +
      (controlArea ? controlArea.offsetHeight : 0)
      +
      12;

    hint.style.bottom = offset + "px";
    hint.style.display = "block";

  }else{

    hint.style.display = "none";

  }

}

function scrollHintClick(){

  const chat = document.getElementById("chat");

  if(!chat){
    return;
  }

  chat.scrollTop =
    chat.scrollTop
    +
    chat.clientHeight * 0.75;

  requestAnimationFrame(updateScrollHint);

}

/* =========================================
   INLINE BUTTONS
   （回答の直後に、控えめなボタンを
   　通常配置する。固定エリアは使わない）
========================================= */

let currentInlineButtonsInfo = {
  screen:null,
  element:null
};

// メニュー内の各説明の直後にだけ、単発の案内ボタンを
// 差し込むための軽量版（画面全体のボタン一覧は変更しない）
function addStandaloneInlineButton(label, onclick){

  const chat = document.getElementById("chat");

  const wrapper = document.createElement("div");

  wrapper.className = "inline-buttons";

  const btn = document.createElement("button");

  btn.className = "inline-button";

  const labelSpan = document.createElement("span");

  labelSpan.className = "inline-button-label";

  labelSpan.innerText = label;

  btn.appendChild(labelSpan);

  btn.onclick = onclick;

  wrapper.appendChild(btn);

  chat.appendChild(wrapper);

  requestAnimationFrame(updateScrollHint);

}

function addInlineButtons(buttons){

  const chat = document.getElementById("chat");

  // 同じ画面のボタン塊がすでにあれば、
  // （間にユーザーの発言などが挟まっていても）
  // それを消してから新しいものを追加する
  if(
    currentInlineButtonsInfo.screen === state.currentScreen
    &&
    currentInlineButtonsInfo.element
    &&
    currentInlineButtonsInfo.element.parentNode === chat
  ){
    chat.removeChild(currentInlineButtonsInfo.element);
  }

  const wrapper = document.createElement("div");

  wrapper.className = "inline-buttons";

  buttons.forEach(b=>{

    const btn = document.createElement("button");

    btn.className =
      "inline-button" +
      (b.secondary ? " secondary" : "") +
      (b.highlight ? " highlight" : "") +
      (b.disabled ? " disabled" : "");

    const labelSpan = document.createElement("span");

    labelSpan.className = "inline-button-label";

    labelSpan.innerText = b.label;

    btn.appendChild(labelSpan);

    if(b.disabled){
      btn.disabled = true;
    }else{
      btn.onclick = b.onclick;
    }

    wrapper.appendChild(btn);

  });

  chat.appendChild(wrapper);

  currentInlineButtonsInfo = {
    screen:state.currentScreen,
    element:wrapper
  };

  requestAnimationFrame(updateScrollHint);

}

// スクロール調整を1回にまとめるための仕組み。
// 同じタイミングで何度呼ばれても、実際の
// スクロール処理は最後に1回だけ・最新の
// 対象（質問カードがあればそちら優先）に対して行う。
let scrollUpdatePending = false;

// このタップ操作で最初に追加された要素
// （スクロールは常にここを優先して表示する）
let turnStartElement = null;

function scheduleScrollUpdate(){

  if(scrollUpdatePending){
    return;
  }

  scrollUpdatePending = true;

  requestAnimationFrame(() => {

    scrollUpdatePending = false;

    const chat = document.getElementById("chat");

    if(!chat) return;

    if(turnStartElement){

      // 今回の操作で追加された内容の先頭を表示する
      chat.scrollTop = turnStartElement.offsetTop - 10;

      // 次の操作のために必ずリセットする
      turnStartElement = null;

    }else{

      // 質問カードがあれば、そちらを優先して表示する
      const latestCard =
        document.querySelector(".question-card.latest");

      if(latestCard){
        chat.scrollTop = latestCard.offsetTop - 10;
      }else if(chat.lastElementChild){
        chat.scrollTop =
          chat.lastElementChild.offsetTop - 10;
      }

    }

    updateScrollHint();

  });

}

function addBotMessage(text){

  const div = addMessage("bot",text);

  scheduleScrollUpdate();

  return div;

}

function addUserMessage(text){
  addMessage("user",text);
}

届く「非課税証明書」等で

（${basisLabel}）

// 検索用に文字列を正規化する
// （全角英数字→半角、大文字→小文字、
// 　記号のゆらぎを統一）
function normalizeForSearch(str){

  return str
    // 全角英数字・記号 → 半角
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (ch)=>
      String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
    )
    // 全角スペース → 半角スペース
    .replace(/　/g, " ")
    // 波ダッシュ・長音記号・ハイフン類の統一
    .replace(/[－―ー]/g, "-")
    // 中黒・スラッシュ類の統一
    .replace(/[／]/g, "/")
    .replace(/[・]/g, "・")
    // 大文字を小文字に統一
    .toLowerCase()
    .trim();

}

function runNanbyoSearch(){

  const inputEl = document.getElementById("nanbyoSearchInput");

  if(!inputEl) return;

  const rawQuery = inputEl.value.trim();

  if(!rawQuery){

    addBotMessage("病名の一部、または告示番号を入力してください。");
    return;

  }

  const query = normalizeForSearch(rawQuery);

  const isNumberQuery = /^[0-9]+$/.test(query);

  let results;

  if(isNumberQuery){

    results = NANBYO_LIST.filter(d=>
      String(d.no) === query
    );

  }else{

    results = NANBYO_LIST.filter(d=>
      normalizeForSearch(d.name).includes(query)
    );

  }

  if(results.length === 0){

    addBotMessage(`「${rawQuery}」に一致する指定難病は
見つかりませんでした。

・別の書き方（カタカナ／ひらがな／
　部分的な単語）で試してみてください
・見つからない場合でも、
　医師の診断名と異なる場合が
　ありますので、主治医や
　難病相談支援センターへ
　ご確認ください`);

    return;

  }

  if(results.length > 20){

    addBotMessage(`「${rawQuery}」に一致するものが
${results.length}件見つかりました。
多すぎるため、もう少し詳しい
キーワードで絞り込んでください。`);

    return;

  }

  let message = `「${rawQuery}」の検索結果
（${results.length}件）：

`;

  results.forEach(d=>{
    message += `・${d.name}（告示番号${d.no}）\n`;
  });

  message += `
該当する病名がある場合は、
指定難病医療費助成の対象に
なる可能性があります。

正式な対象・重症度の判定は、
お住まいの都道府県・保健所へ
ご確認ください。`;

  addBotMessage(message);

}

/* =========================================
   RICH TEXT（**text** を太字に変換）
========================================= */

function formatRichText(text){

  const escaped =
    text
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");

  const withDivider =
    escaped.replace(
      /^---$/gm,
      '<hr class="dotted-divider">'
    );

  const withBold =
    withDivider.replace(
      /\*\*([\s\S]+?)\*\*/g,
      "<strong>$1</strong>"
    );

  // [[...]]で囲むと、その行を四角枠で囲む
  const withBox =
    withBold.replace(
      /\[\[([\s\S]+?)\]\]/g,
      '<span class="highlight-box">$1</span>'
    );

  // URLをタップできるリンクに変換する
  return withBox.replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" class="message-link">$1</a>'
  );

}

function addQuestionCard(text){

  document
    .querySelectorAll(".question-card")
    .forEach(card=>{
      card.classList.remove("latest");
    });

  // 新しい質問が表示される時点で、
  // それより前のボタン群（画面名が違う場合も含む）は
  // 必ず取り除く。古いボタンが残ったまま
  // 新しい画面が下に追加されるのを防ぐ。
  if(
    currentInlineButtonsInfo.element
    &&
    currentInlineButtonsInfo.element.parentNode ===
      document.getElementById("chat")
  ){
    document
      .getElementById("chat")
      .removeChild(currentInlineButtonsInfo.element);

    currentInlineButtonsInfo = {
      screen:null,
      element:null
    };
  }

  state.messages.push({
    role:"question",
    text
  });

  const div = document.createElement("div");

  div.className = "question-card latest";

  div.innerHTML = formatRichText(text);

  document
    .getElementById("chat")
    .appendChild(div);

  if(!turnStartElement){
    turnStartElement = div;
  }

}

/* =========================================
   REBUILD
========================================= */

function rebuildChat(){

  const chat = document.getElementById("chat");

  chat.innerHTML ="";

  const lastQuestionIndex =
    [...state.messages]
      .map((m,i)=> m.role==="question" ? i : -1)
      .filter(i=>i!==-1)
      .pop();

  state.messages.forEach((msg,i)=>{

    const div = document.createElement("div");

    if(msg.role==="question"){

      div.className =
        i===lastQuestionIndex
          ? "question-card latest"
          : "question-card";

      div.innerHTML = formatRichText(msg.text);

    }else{

      div.className = "message " + msg.role;

      div.innerHTML = formatRichText(msg.text);

    }

    chat.appendChild(div);

  });

}

const GOOGLE_FORM_VALUE_MAP = {

    "退院後の生活":"退院後の生活",
    "介護・介護保険":"介護・介護保険",

  }

function submitToGoogleForm(){

  try{

    const d = state.surveyData;

    const formData = new FormData();

    formData.append(
      GOOGLE_FORM_CONFIG.entries.category,
      GOOGLE_FORM_VALUE_MAP.category[d.category]
        || d.category
        || ""
    );

    formData.append(
      GOOGLE_FORM_CONFIG.entries.rating,
      GOOGLE_FORM_VALUE_MAP.rating[d.ratingLabel]
        || d.ratingLabel
        || ""
    );

    formData.append(
      GOOGLE_FORM_CONFIG.entries.clarified,
      GOOGLE_FORM_VALUE_MAP.clarified[d.clarified]
        || d.clarified
        || ""
    );

    formData.append(
      GOOGLE_FORM_CONFIG.entries.willConsult,
      GOOGLE_FORM_VALUE_MAP.willConsult[d.willConsult]
        || d.willConsult
        || ""
    );

    formData.append(
      GOOGLE_FORM_CONFIG.entries.freeText,
      d.freeText || ""
    );

    fetch(
      GOOGLE_FORM_CONFIG.actionUrl,
      {
        method:"POST",
        mode:"no-cors",
        body:formData
      }
    );

  }catch(e){

    // 送信に失敗しても、アプリの動作は止めない

  }

function saveSurveyResponse(){

  try{

    const statsKey = "michiStats";

    const rawStats = localStorage.getItem(statsKey);

    const stats =
      rawStats ? JSON.parse(rawStats) : {};

    stats.surveyResponses = (stats.surveyResponses || 0) + 1;

    localStorage.setItem(
      statsKey,
      JSON.stringify(stats)
    );

    const responsesKey = "michiSurveyResponses";

    const rawResponses = localStorage.getItem(responsesKey);

    const responses =
      rawResponses
        ? JSON.parse(rawResponses)
        : [];

    responses.push({
      timestamp:
        new Date().toISOString(),
      category:
        state.surveyData.category,
      rating:
        state.surveyData.rating,
      ratingLabel:
        state.surveyData.ratingLabel,
      clarified:
        state.surveyData.clarified,
      willConsult:
        state.surveyData.willConsult,
      freeText:
        state.surveyData.freeText
    });

    localStorage.setItem(
      responsesKey,
      JSON.stringify(responses)
    );

  }catch(e){}

  submitToGoogleForm();

}

/* =========================================
   VERSION INFO（GitHubの最新コミットから取得）
========================================= */

async function loadVersionInfo(){

  const el = document.getElementById("versionInfo");

  if(!el){
    return;
  }

  const CACHE_KEY = "seidoNaviVersionCache";

  // まずキャッシュがあれば先に表示しておく
  // （API取得中や失敗時も空白にしない）
  try{

    const cached = localStorage.getItem(CACHE_KEY);

    if(cached){
      el.innerText = cached;
    }

  }catch(e){}

  try{

    const res = await fetch(
      "https://api.github.com/repos/seido-msw/seido-msw/commits?path=index.html&per_page=1"
    );

    if(!res.ok){
      return;
    }

    const data = await res.json();

    if(!data || !data[0]){
      return;
    }

    const sha = data[0].sha.slice(0,7);

    const commitDate =
      new Date(data[0].commit.committer.date);

    const formatted =
      commitDate.toLocaleString(
        "ja-JP",
        {
          timeZone:"Asia/Tokyo",
          year:"numeric",
          month:"2-digit",
          day:"2-digit",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    // Linkヘッダーの rel="last" から
    // 総コミット数（＝更新回数）を取得する
    let updateCount = 1;

    const linkHeader = res.headers.get("Link");

    if(linkHeader){

      const match =
        linkHeader.match(
          /page=(\d+)>; rel="last"/
        );

      if(match){
        updateCount = Number(match[1]);
      }

    }

    const displayText =
      "ver.1." + updateCount +
      "　最終更新: " + formatted;

    el.innerText = displayText;

    try{
      localStorage.setItem(
        CACHE_KEY,
        displayText
      );
    }catch(e){}

  }catch(e){

    // 取得できなくても画面には影響させない

  }

}

/* =========================================
   VIEWPORT HEIGHT（実測値で高さを固定する）
   iOSのSafariはCSSの100vh/100svhが
   ツールバーの表示状態と合わず、
   下部が見切れることがあるため、
   JavaScriptで実際の高さを直接指定する
========================================= */

function setViewportHeight(){

  const container = document.querySelector(".container");

  if(!container){
    return;
  }

  const height =
    (window.visualViewport)
      ? window.visualViewport.height
      : window.innerHeight;

  container.style.height = height + "px";

  ensureScrollRoom();

}

if(window.visualViewport){

  window.visualViewport.addEventListener(
    "resize",
    setViewportHeight
  );

  window.visualViewport.addEventListener(
    "scroll",
    setViewportHeight
  );

}else{

  window.addEventListener(
    "resize",
    setViewportHeight
  );

}

window.addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(setViewportHeight, 100);
    setTimeout(setViewportHeight, 400);
  }
);

// ページを開いた直後は、Safariのツールバーの
// 表示状態が少し遅れて確定することがあるため、
// 何度か測り直して最新の高さに合わせる
[0, 100, 300, 600, 1000].forEach(delay=>{
  setTimeout(setViewportHeight, delay);
});

window.onload = ()=>{

  setViewportHeight();

  loadProfileFromSession();

  ensureScrollRoom();

  renderScreen();

  loadVersionInfo();

  const chatEl = document.getElementById("chat");

  if(chatEl){
    chatEl.addEventListener(
      "scroll",
      updateScrollHint
    );
  }

};
